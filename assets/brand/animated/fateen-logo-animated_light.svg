<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 491 124" role="img" aria-label="Fateen">
<style>
.l{transform-box:fill-box;opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.d{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) 1.05s forwards,beat 1.4s ease-in-out 1.7s infinite}
@keyframes pop{to{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}}
.r{fill:none;stroke:#FF4F1F;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1.4s ease-out 1.7s infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
@media (prefers-reduced-motion:reduce){.l,.d{animation:none;opacity:1;transform:none}.r{display:none}}
